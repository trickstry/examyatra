<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExamYatra Mock Test</title><style>body{margin:0;font-family:system-ui;background:#FFFBF0}#top{background:#1a3c34;color:#fff;padding:12px;display:flex;justify-content:space-between}#quiz{max-width:800px;margin:20px auto;background:#fff;padding:20px;border-radius:12px}.opt{border:1px solid #ddd;padding:10px;margin:6px 0;border-radius:8px;cursor:pointer}.sel{background:#1a3c34;color:#fff}</style></head><body><div id="top"><b>ExamYatra - PRT Mock</b><span id="timer">150:00</span></div><div id="quiz"><div id="qbox"></div><button id="next" style="background:#b78a4a;color:#fff;border:none;padding:10px 20px;border-radius:8px;margin-top:10px">Next</button><div id="res" style="display:none"></div></div><script>
let qs=[{q:"बालक का प्रथम गुरु कौन है?",o:["माता","पिता","शिक्षक","समाज"],a:0},{q:"PRT में हिंदी के अंक?",o:["30","20","10","15"],a:0},{q:"NEP 2020 में 5+3+3+4 क्या है?",o:["नया शैक्षिक ढांचा","पुराना ढांचा","परीक्षा पैटर्न","कोई नहीं"],a:0}];
let idx=0,ans={};function show(){let q=qs[idx];document.getElementById('qbox').innerHTML=`<b>Q${idx+1}. ${q.q}</b>`+q.o.map((o,i)=>`<div class='opt ${ans[idx]==i?'sel':''}' onclick='ans[${idx}]=${i};show()'>${String.fromCharCode(65+i)}. ${o}</div>`).join('');}
document.getElementById('next').onclick=()=>{if(idx<qs.length-1){idx++;show()}else{let s=0;qs.forEach((q,i)=>{if(ans[i]==q.a)s++});document.getElementById('qbox').innerHTML='';document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`<h2>Score: ${s}/${qs.length}</h2><p>ExamYatra - तैयारी का सही रास्ता</p><a href='index.html'>Back</a>`;document.getElementById('next').style.display='none'}};show();
</script></body></html>
