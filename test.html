<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExamYatra Mock</title><style>body{margin:0;font-family:system-ui;background:#FFFBF0}#top{background:#1a3c34;color:#fff;padding:12px;display:flex;justify-content:space-between}#quiz{max-width:800px;margin:20px auto;background:#fff;padding:20px;border-radius:12px}.opt{border:1px solid #ddd;padding:10px;margin:8px 0;border-radius:8px;cursor:pointer}.sel{background:#1a3c34;color:#fff}</style></head><body>
<div id="top"><b id="title">ExamYatra</b><span id="timer">150:00</span></div><div id="quiz"><div id="qbox">Loading...</div><button id="next" style="background:#b78a4a;color:#fff;border:none;padding:10px 20px;border-radius:6px">Next</button><div id="res" style="display:none"></div></div>
<script>
let mockNo=localStorage.getItem('mock')||1;
document.getElementById('title').innerText='ExamYatra - PRT Mock '+mockNo;
let qs=[], idx=0, ans={};
fetch('data/mock'+mockNo+'.json').then(r=>r.json()).then(data=>{qs=data; show();}).catch(()=>{document.getElementById('qbox').innerHTML='Questions abhi add nahi hue. <a href=index.html>Back</a>'});
function show(){let q=qs[idx]; if(!q)return; document.getElementById('qbox').innerHTML=`<b>Q${idx+1}. ${q.question}</b>`+q.options.map((o,i)=>`<div class='opt ${ans[idx]==i?'sel':''}' onclick='ans[${idx}]=${i};show()'>${String.fromCharCode(65+i)}. ${o}</div>`).join('');}
document.getElementById('next').onclick=()=>{if(idx<qs.length-1){idx++;show()}else{let s=0;qs.forEach((q,i)=>{if(ans[i]==q.answer)s++});document.getElementById('qbox').innerHTML='';document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`<h2>Score: ${s}/${qs.length}</h2><a href='index.html'>Back to Home</a>`;document.getElementById('next').style.display='none'}};
</script></body></html>
